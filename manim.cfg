[CLI]
# Tudo que o Manim gerar vai para a pasta media/, organizado por cena e qualidade
media_dir = ./media
video_dir = {media_dir}/videos/{module_name}/{quality}
images_dir = {media_dir}/images/{module_name}
# Qualidade padrão dos renders (mude para -qh na linha de comando p/ alta qualidade)
quality = medium_quality
# Abre o video automaticamente ao terminar o render
preview = True
