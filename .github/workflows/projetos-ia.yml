name: Testes dos projetos de IA

on:
  push:
    paths:
      - "projetos-ia/**"
      - ".github/workflows/projetos-ia.yml"
  pull_request:
    paths:
      - "projetos-ia/**"
      - ".github/workflows/projetos-ia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto:
          - 01-previsao-churn
          - 02-previsao-demanda
          - 03-deteccao-fraude
          - 04-sistema-recomendacao
          - 05-agente-text-to-sql
    defaults:
      run:
        working-directory: projetos-ia/${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projetos-ia/${{ matrix.projeto }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
